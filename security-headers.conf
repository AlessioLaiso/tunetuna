# Security headers, included from nginx.conf.
# nginx drops inherited add_header directives in any location that defines its
# own add_header, so this file must be included in every such location.
#
# The Jellyfin server URL is user-supplied and may be plain http:// (e.g. a LAN
# server), so connect/img/media sources allow http:/ws: as well as https:/wss:.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains;" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; connect-src 'self' https: http: wss: ws:; media-src 'self' blob: https: http:; frame-ancestors 'self';" always;
